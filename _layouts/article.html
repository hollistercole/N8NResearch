---
layout: default
---
<article class="research-article">
  <h1>{{ page.title }}</h1>
  
  <div class="article-content">
    {{ content }}
  </div>
  
  {% assign project_path = page.path | split: "/" %}
  {% assign project_name = project_path[1] %}
  {% assign project_url = "/projects/" | append: project_name | append: "/" %}
  
  <div class="back-link">
    <a href="{{ project_url | relative_url }}">Back to {{ page.project_title | default: "project" }}</a>
  </div>
</article>
